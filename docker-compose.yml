services:
  db:
    image: postgres:latest
    container_name: fhchallenge-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fhchallenge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - fhchallenge-network

  backend:
    build: .
    container_name: graphql-backend
    environment:
      DATABASE_URL: postgresql://root:root@db:5432/fhchallenge
    ports:
      - "4000:4000"
    depends_on:
      - db
    networks:
      - fhchallenge-network

volumes:
  postgres_data:

networks:
  fhchallenge-network:
    driver: bridge
